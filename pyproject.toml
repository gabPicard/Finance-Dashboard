[build-system]
requires = ["scikit-build-core>=0.6.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "finance-dashboard"
version = "0.1.0"
description = "Quantitative finance framework with multi-strategy portfolio optimisation and backtesting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "plotly>=5.18.0",
    "dash>=2.14.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.36",
    "qpsolvers[open_source_solvers]>=4.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
